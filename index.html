<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kedai Kersa</title>
  <meta name="description" content="">
  
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234a3828' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M18 8h1a4 4 0 0 1 0 8h-1'></path><path d='M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z'></path><line x1='6' y1='1' x2='6' y2='4'></line><line x1='10' y1='1' x2='10' y2='4'></line><line x1='14' y1='1' x2='14' y2='4'></line></svg>">
  <link rel="stylesheet" href="style.css">
  <!-- Data konfigurasi konten mudah diedit -->
  <script src="data.js"></script>
  <script src="main.js" defer></script>
</head>
<body>

  <!-- Navbar -->
  <header class="site-header">
    <nav class="navbar" id="navbar" aria-label="Navigasi Utama">
      <div class="nav-container">
        <a href="#home" class="logo" aria-label="Kedai Kersa Beranda">
          <span class="logo-icon" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
              <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
              <line x1="6" y1="1" x2="6" y2="4"></line>
              <line x1="10" y1="1" x2="10" y2="4"></line>
              <line x1="14" y1="1" x2="14" y2="4"></line>
            </svg>
          </span>
          <span class="logo-text">
            <span class="logo-title" id="brandName"></span>
            <span class="logo-subtitle" id="brandCity"></span>
          </span>
        </a>

        <ul class="nav-links" id="navLinks">
          <li><a href="#home" class="nav-link active">Beranda</a></li>
          <li><a href="#about" class="nav-link">Tentang</a></li>
          <li><a href="#menu" class="nav-link">Menu</a></li>
          <li><a href="#contact" class="nav-link">Kontak</a></li>
          <li class="mobile-cta-item">
            <a href="#menu" class="btn btn-primary btn-sm mobile-cta">Lihat Menu</a>
          </li>
        </ul>

        <div class="nav-actions">
          <a href="#menu" class="btn btn-primary btn-sm nav-cta">Lihat Menu</a>
          <button class="menu-toggle" id="menuToggle" aria-label="Buka menu navigasi" aria-expanded="false" aria-controls="navLinks">
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
          </button>
        </div>
      </div>
    </nav>
  </header>

  <!-- Hero Section -->
  <section id="home" class="hero">
    <div class="hero-container">
      <div class="hero-content">
        <div class="badge hero-badge" id="heroBadge"></div>
        <h1 class="hero-title" id="heroTitle"></h1>
        <p class="hero-desc" id="heroDesc"></p>
        <div class="hero-actions">
          <a href="#menu" class="btn btn-primary hero-btn" id="heroCtaPrimary">
            <span></span>
            <svg class="btn-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </a>
          <a href="#about" class="btn btn-outline hero-btn" id="heroCtaSecondary"></a>
        </div>

        <div class="hero-highlights" id="heroHighlights"></div>
      </div>

      <div class="hero-visual">
        <div class="visual-card">
          <img src="" alt="" class="hero-image" id="heroImage" loading="eager">
          <div class="visual-badge badge-top">
            <span class="badge-icon" aria-hidden="true">⭐</span>
            <div>
              <strong id="badgeTopRating"></strong>
              <small id="badgeTopLabel"></small>
            </div>
          </div>
          <div class="visual-badge badge-bottom">
            <span class="badge-icon" aria-hidden="true">📍</span>
            <div>
              <strong id="badgeBottomCity"></strong>
              <small id="badgeBottomLabel"></small>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Section 2: About -->
  <section id="about" class="about-section">
    <div class="about-container">
      <span class="badge" id="aboutBadge"></span>
      <h2 id="aboutTitle"></h2>
      <p class="about-desc" id="aboutDesc"></p>
      <div class="features-grid" id="aboutFeatures"></div>
    </div>
  </section>

  <!-- Section 3: Menu -->
  <section id="menu" class="menu-section">
    <div class="menu-container">
      <span class="badge" id="menuBadge"></span>
      <h2 id="menuTitle"></h2>
      <p class="menu-desc" id="menuDesc"></p>
      <div class="menu-grid" id="menuGrid"></div>
    </div>
  </section>

  <!-- Section 4: Contact & Footer -->
  <footer id="contact" class="contact-section">
    <div class="contact-container">
      <!-- Top: Brand + tagline -->
      <div class="footer-brand">
        <a href="#home" class="footer-logo" aria-label="Kedai Kersa Beranda">
          <span class="footer-logo-icon" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
              <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
              <line x1="6" y1="1" x2="6" y2="4"></line>
              <line x1="10" y1="1" x2="10" y2="4"></line>
              <line x1="14" y1="1" x2="14" y2="4"></line>
            </svg>
          </span>
          <span class="footer-logo-name" id="footerBrandName"></span>
        </a>
        <p class="footer-tagline" id="footerTagline"></p>
      </div>

      <!-- Middle: 3 columns -->
      <div class="footer-columns">
        <!-- Column 1: Jam Operasional -->
        <div class="footer-col">
          <h4 class="footer-col-title" id="openingHoursTitle"></h4>
          <ul class="footer-info-list" id="openingHoursList"></ul>
        </div>

        <!-- Column 2: Lokasi -->
        <div class="footer-col">
          <h4 class="footer-col-title" id="locationTitle"></h4>
          <ul class="footer-info-list" id="locationList"></ul>
        </div>

        <!-- Column 3: Hubungi Kami -->
        <div class="footer-col">
          <h4 class="footer-col-title" id="socialsTitle"></h4>
          <div class="contact-links" id="contactLinks">
            <!-- WhatsApp -->
            <a href="#" class="contact-link contact-link--wa" id="footerWaLink" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp">
              <span class="contact-link-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                  <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413z"/>
                </svg>
              </span>
              <span>WhatsApp</span>
              <span class="contact-link-sub"></span>
            </a>

            <!-- Instagram -->
            <a href="#" class="contact-link contact-link--ig" id="footerIgLink" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
              <span class="contact-link-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                  <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.406-11.845a1.44 1.44 0 1 0 0 2.881 1.44 1.44 0 0 0 0-2.881z"/>
                </svg>
              </span>
              <span>Instagram</span>
              <span class="contact-link-sub"></span>
            </a>

            <!-- TikTok -->
            <a href="#" class="contact-link contact-link--tt" id="footerTtLink" target="_blank" rel="noopener noreferrer" aria-label="TikTok">
              <span class="contact-link-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                  <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1V9.01a6.33 6.33 0 0 0-.79-.05 6.34 6.34 0 0 0-6.34 6.34 6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.33-6.34V8.69a8.18 8.18 0 0 0 4.78 1.52V6.75a4.85 4.85 0 0 1-1.01-.06z"/>
                </svg>
              </span>
              <span>TikTok</span>
              <span class="contact-link-sub"></span>
            </a>
          </div>
        </div>
      </div><!-- /.footer-columns -->
    </div><!-- /.contact-container -->

    <!-- Footer Bottom Bar -->
    <div class="footer-bottom">
      <p id="footerCopyright"></p>
      <p class="footer-made" id="footerMade"></p>
    </div>
  </footer>

</body>
</html>
